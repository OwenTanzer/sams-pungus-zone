<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Count to One Million</title>
<style>
  :root {
    color-scheme: light dark;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #0f172a;
    color: #f8fafc;
  }
  h1 {
    font-weight: 600;
    font-size: 1.1rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #94a3b8;
    margin: 0;
  }
  #count {
    font-variant-numeric: tabular-nums;
    font-size: clamp(2.5rem, 10vw, 6rem);
    font-weight: 700;
    min-width: 10ch;
    text-align: center;
  }
  #bar-track {
    width: min(90vw, 480px);
    height: 10px;
    border-radius: 999px;
    background: #1e293b;
    overflow: hidden;
  }
  #bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #38bdf8, #818cf8);
    transition: width 0.1s linear;
  }
  #status {
    color: #64748b;
    font-size: 0.9rem;
  }
  .controls {
    display: flex;
    gap: 0.75rem;
  }
  button {
    font: inherit;
    padding: 0.5rem 1.25rem;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #1e293b;
    color: #f8fafc;
    cursor: pointer;
  }
  button:hover { background: #334155; }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <h1>Counting to one million</h1>
  <div id="count">0</div>
  <div id="bar-track"><div id="bar-fill"></div></div>
  <div id="status">Ready</div>
  <div class="controls">
    <button id="start">Start</button>
    <button id="reset">Reset</button>
  </div>

<script>
  const TARGET = 1_000_000;
  const countEl = document.getElementById('count');
  const barEl = document.getElementById('bar-fill');
  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('start');
  const resetBtn = document.getElementById('reset');

  const STORAGE_KEY = 'count-to-million-v2';

  let n = 0;
  let running = false;
  let startEpoch = 0; // Date.now() at which n would have been 0

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ running, startEpoch, n }));
  }

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved) {
        running = saved.running;
        startEpoch = saved.startEpoch;
        n = saved.n;
      }
    } catch {}
  }

  function render() {
    countEl.textContent = n.toLocaleString();
    barEl.style.width = (n / TARGET * 100) + '%';
  }

  // Derive n from real elapsed time (rather than an incrementing setInterval
  // counter) so the count stays accurate at exactly one per second even if
  // the tab is backgrounded/throttled or the page is reloaded mid-count.
  function update() {
    if (!running) return;
    n = Math.min(TARGET, Math.floor((Date.now() - startEpoch) / 1000));
    render();
    if (n >= TARGET) {
      running = false;
      statusEl.textContent = 'Done!';
      startBtn.disabled = true;
    } else {
      statusEl.textContent = 'Counting... (1 per second)';
    }
    save();
  }

  startBtn.addEventListener('click', () => {
    if (running) return;
    running = true;
    startEpoch = Date.now() - n * 1000;
    statusEl.textContent = 'Counting... (1 per second)';
    startBtn.disabled = true;
    save();
  });

  resetBtn.addEventListener('click', () => {
    running = false;
    n = 0;
    startEpoch = 0;
    render();
    statusEl.textContent = 'Ready';
    startBtn.disabled = false;
    save();
  });

  load();
  render();
  if (running) {
    statusEl.textContent = n >= TARGET ? 'Done!' : 'Counting... (1 per second)';
    startBtn.disabled = true;
  }
  setInterval(update, 250);
</script>
</body>
</html>
